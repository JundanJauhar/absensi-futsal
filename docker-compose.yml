services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      face-service:
        condition: service_healthy
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ftms}
      DB_USERNAME: ${POSTGRES_USER:-ftms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_started

  face-service:
    build:
      context: ./face-service
    ports:
      - "8001:8001"
    environment:
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftms}
      POSTGRES_USER: ${POSTGRES_USER:-ftms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
